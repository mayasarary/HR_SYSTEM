
{% load i18n %}
<!doctype html>
{% load static %}

{% get_current_language as LANGUAGE_CODE %}
{% get_current_language_bidi as LANGUAGE_BIDI %}
<html lang="{{ LANGUAGE_CODE }}" dir="{{ LANGUAGE_BIDI|yesno:'rtl,ltr' }}">
<head>
    <meta charset="utf-8">
    {% include 'includes/theme.html' %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% translate "HR System" %}</title>
    <link href="{% if LANGUAGE_BIDI %}{% static 'tabler/css/tabler.rtl.min.css' %}{% else %}{% static 'tabler/css/tabler.min.css' %}{% endif %}" rel="stylesheet">
</head>

<body>
<div class="page">
    {% include 'includes/sidebar.html' %}
</div>

<script src="{% static 'tabler/js/tabler.min.js' %}"></script>
</body>
</html>
